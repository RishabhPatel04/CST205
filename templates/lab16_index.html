<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 16 — Images</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center">Lab 16 — Static Image (Tasks 1 &amp; 2)</h1>

        <!-- Task 1: image referenced with url_for('static', ...) -->
        <!-- Task 2: Bootstrap styling with img-fluid and w-75 -->
        <div class="text-center">
            <img src="{{ url_for('static', filename='images/fire.png') }}"
                 class="img-fluid w-75"
                 alt="Fire">
        </div>

        <p class="text-center mt-4">
            <a href="{{ url_for('dictionary') }}">Dictionary (Task 3)</a> |
            <a href="{{ url_for('random_negative') }}">Random Negative (Task 4)</a>
        </p>
    </div>
    {{ bootstrap.load_js() }}
</body>
</html>
