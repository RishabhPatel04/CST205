<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 16 — Dictionary</title>
    {{ bootstrap.load_css() }}
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center">Lab 16 — Acronyms (Task 3)</h1>

        <!-- Task 3: Jinja for loop over the imported dictionary -->
        <ul class="list-group w-50 mx-auto">
            {% for abbr, meaning in acronyms.items() %}
            <li class="list-group-item">
                <strong>{{ abbr }}</strong>: {{ meaning }}
            </li>
            {% endfor %}
        </ul>

        <p class="text-center mt-4">
            <a href="{{ url_for('index') }}">Back home</a>
        </p>
    </div>
    {{ bootstrap.load_js() }}
</body>
</html>
